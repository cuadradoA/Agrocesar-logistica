<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgroCesar - MFE Logística y Carrito</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body style="background-color: var(--agro-fondo); padding: 20px;">

  <div style="max-width: 700px; margin: 0 auto; text-align: center; margin-bottom: 20px;">
    <h2 style="color: var(--agro-primario);">AgroCesar Marketplace - MFE Logística</h2>
    <p>Desarrollado con <strong>Svelte (MFE Logística)</strong></p>
    
    <div style="margin-top: 15px; display: flex; gap: 10px; justify-content: center;">
      <button class="agro-btn-circle" style="width: auto; padding: 0 16px; border-radius: 6px; background: var(--agro-primario); color: white;" onclick="mountAgroLogistica('mfe-logistica-container', { offlineMode: true })">Montar Logística</button>
      <button class="agro-btn-circle" style="width: auto; padding: 0 16px; border-radius: 6px; background: #dc2626; color: white;" onclick="unmountAgroLogistica('mfe-logistica-container')">Desmontar Logística</button>
    </div>
  </div>

  <div id="mfe-logistica-container"></div>

  <script src="logistica.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      mountAgroLogistica('mfe-logistica-container', { offlineMode: true });
    });
  </script>
</body>
</html>
